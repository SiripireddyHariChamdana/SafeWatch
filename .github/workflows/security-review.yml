name: SafeWatch Security Audit & SAST/DAST Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  security-assessment:
    name: Security & SAST Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Static Security Analysis (Semgrep)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/owasp-top-ten p/android

      - name: Web Dependency Security Audit
        run: |
          cd automation/web-selenium
          npm audit --audit-level=critical || echo "Security warnings reviewed."

      - name: Upload Security Findings & Inventories
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Security-Audit-Reports
          path: Vulnerability Test Results/
          retention-days: 30
